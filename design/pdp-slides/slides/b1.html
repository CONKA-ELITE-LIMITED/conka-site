<!doctype html><meta charset="utf-8"><title>B1 Benefit Stack (Both)</title>
<link rel="stylesheet" href="_base.css">
<style>
.slide{background:#ffffff}

/* Bottle emerging from the bottom-right corner, cropped by both edges
   (GrayMatter treatment). Cut out from the 2752px studio shot. */
.bg{position:absolute;inset:0;z-index:0;background-image:url("../assets/BothMetalTray.jpg");
  background-size:auto 1715px;background-repeat:no-repeat;background-position:calc(100% + 300px) 50%}
.scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,
  rgba(255,255,255,.99) 0%, rgba(255,255,255,.97) 34%,
  rgba(255,255,255,.62) 46%, rgba(255,255,255,0) 60%)}

h1{font-family:Favorit;font-weight:500;font-weight:700;font-size:152px;line-height:1.02;
  letter-spacing:-.03em;max-width:1080px;position:relative;z-index:3}
h1 em{font-style:italic}
h1 .t2{display:block;font-family:NHG;font-weight:500;font-size:104px;letter-spacing:-.025em;
  margin-top:6px;padding-left:78px}

.sub{font-weight:500;font-size:74px;line-height:1.2;letter-spacing:-.018em;
  color:#2f3a63;margin-top:32px;max-width:1010px;position:relative;z-index:3}

ul{list-style:none;margin-top:70px;max-width:1120px;position:relative;z-index:3}
li{display:flex;align-items:center;gap:38px;padding:21px 0;
    font-weight:500;font-size:76px;letter-spacing:-.022em;color:var(--navy)}

.ic{flex:0 0 102px;width:102px;height:102px;border-radius:50%;background:#dde4f0;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:66px;height:64px;stroke:var(--navy);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.ic svg .fl{fill:var(--navy);stroke:none}

.foot{position:absolute;left:var(--pad);bottom:94px;display:flex;align-items:center;
  gap:30px;z-index:3}
.foot img{width:148px}
.foot span{font-family:JBM,monospace;font-size:36px;font-weight:500;letter-spacing:.09em;
  line-height:1.5;color:#3f4a75}
</style>
<div class="slide">
  <div class="bg"></div>
  <div class="scrim"></div>

  <h1>A Sharper Mind.<span class="t2">Morning to Evening.</span></h1>
  <div class="sub">Flow in the morning. Clear in the afternoon.</div>

  <ul>
    <li><span class="ic"><svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/>
      <circle class="fl" cx="12" cy="12" r="1.8"/></svg></span>Focus &amp; Clarity</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M13.4 2.2 5.8 13.3h5.2L10.3 21.8 18.2 10.4h-5.3z"/></svg></span>All-Day Energy</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M2.6 8.2c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      <path d="M2.6 13c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      <path d="M2.6 17.8c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      </svg></span>No Brain Fog</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M4.5 19.5h15"/>
      <path d="M7.4 19.5v-4.6M12 19.5V9.9M16.6 19.5V4.8"/>
      </svg></span>Stronger Cognition</li>
  </ul>

  <div class="foot"><img src="../../../public/logos/InformedSportLogo.png">
